  /* ---------- main render ---------- */
  function render(animate){
    cardsAnimate = !!animate;
    const view = $("#view");
    const capOpt  = $("#sort option[value='capacity']");
    const prioOpt = $("#sort option[value='priority']");
    const warrOpt = $("#sort option[value='warranty']");
    const voltOpt = $("#sort option[value='voltage']");
    const isWishTab = ui.tab==="wishlist";
    if(capOpt)  capOpt.hidden  = ui.tab!=="batteries";
    if(prioOpt) prioOpt.hidden = !isWishTab;
    if(warrOpt) warrOpt.hidden = isWishTab;   // wishlist has no warranty
    if(voltOpt) voltOpt.hidden = isWishTab;   // wishlist groups by priority instead
    if(ui.sort==="capacity" && ui.tab!=="batteries") ui.sort="name";
    if(ui.sort==="priority" && !isWishTab) ui.sort="name";
    if((ui.sort==="warranty"||ui.sort==="voltage") && isWishTab) ui.sort="name";
    $("#sort").value = ui.sort;
    syncSortUI();

    const tb = $("#toolbar");
    tb.style.display = ui.tab==="settings" ? "none" : "flex";
    $("#add-label").textContent = ui.tab==="batteries" ? "Add battery" : isWishTab ? "Add item" : "Add tool";
    $("#search").placeholder = isWishTab ? "Search your wishlist…" : "Search tools, models, serials…";

    if(ui.tab==="tools") view.innerHTML = renderGrid(false);
    else if(ui.tab==="batteries") view.innerHTML = renderGrid(true);
    else if(ui.tab==="wishlist") view.innerHTML = renderWishlist();
    else { view.innerHTML = renderSettings(); refreshBackupFolderUI(); }

    refreshStats(false);
    $("#c-tools").textContent = data.tools.length;
    $("#c-batteries").textContent = data.batteries.length;
    $("#c-wishlist").textContent = data.wishlist.length;
    loadThumbs();
  }
  function refreshStats(animate){
    const all=[...data.tools,...data.batteries];
    const items=all.length, val=all.reduce((s,x)=>s+(Number(x.price)||0),0), cov=all.filter(x=>wStatus(x)==="green").length;
    if(animate){
      rampNumber($("#stat-items"), items, v=>v);
      rampNumber($("#stat-value"), val, v=>money(v));
      rampNumber($("#stat-warranty"), cov, v=>v);
    }else{
      $("#stat-items").textContent=items; $("#stat-value").textContent=money(val); $("#stat-warranty").textContent=cov;
    }
  }
  function rampNumber(el,to,fmt,dur=950){
    if(!el) return; const start=performance.now(); let done=false;
    function step(t){ if(done) return; const k=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-k,3);
      el.textContent=fmt(Math.round(to*e)); if(k<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
    setTimeout(()=>{ done=true; el.textContent=fmt(to); }, dur+150);
  }
  // load photos from IndexedDB into any rendered thumbs (grid + modal)
  async function loadThumbs(){
    for(const n of $$(".thumb[data-photo-id]")){
      const url = await getPhoto(n.dataset.photoId);
      if(url){ const svg=n.querySelector(":scope > svg"); if(svg) svg.remove(); n.classList.remove("ph");
        if(!n.querySelector("img")){ const img=new Image(); img.src=url; img.alt=""; n.prepend(img); } }
    }
  }

  /* ============================================================
     MODAL  (detail / add / edit)
     ============================================================ */
  function kindOf(id){
    if(data.batteries.find(b=>b.id===id)) return "battery";
    if(data.wishlist.find(w=>w.id===id)) return "wishlist";
    if(data.tools.find(t=>t.id===id)) return "tool";
    return ui.tab==="batteries"?"battery":ui.tab==="wishlist"?"wishlist":"tool";
  }
  function blank(kind){
    const id=uuid();
    if(kind==="wishlist") return {id,name:"",v:"",price:"",priority:"med",url:"",store:"",target:"",notes:"",icon:"tag"};
    if(kind==="battery")  return {id,name:"",model:"",serial:"",v:defaultSystem(),date:"",price:"",warranty_years:DEFAULT_WARRANTY,capacity:"",energy:"",nominal:"",chemistry:"",mfg:"",notes:"",receipt:null,manual:null,icon:"battery"};
    return {id,name:"",model:"",serial:"",v:defaultSystem(),date:"",price:"",warranty_years:DEFAULT_WARRANTY,mfg:"",compat:"",notes:"",receipt:null,manual:null,maint:[],icon:"tool"};
  }
  // effective file metadata = pending change (if any) else the saved record
  function receiptMeta(){ const p=modalState.pending.receipt; return p!==undefined ? p : (modalState.item.receipt||null); }
  function manualMeta(){  const p=modalState.pending.manual;  return p!==undefined ? p : (modalState.item.manual||null); }

  function openModal(id){
    const kind = kindOf(id);
    const isBatt = kind==="battery", isWish = kind==="wishlist";
    const src = isWish?data.wishlist:(isBatt?data.batteries:data.tools);
    const existing = src.find(o=>o.id===id);
    const item = existing ? structuredClone(existing) : blank(kind);
    if(kind==="tool" && !Array.isArray(item.maint)) item.maint=[];
    modalState = { kind, isBatt, isWish, isNew:!existing, item, pending:{ photo:undefined, photoOrig:undefined, crop:undefined, receipt:undefined, manual:undefined } };

    const sysIds = brandSystems().map(s=>s.id);
    let volts = isBatt ? sysIds : sysIds.concat(["AC"]);
    if(item.v && !volts.includes(item.v)) volts=[item.v,...volts];   // keep a legacy value selectable after a brand switch
    const vLabel = v => v==="AC" ? "Corded / AC" : ((sysOf(v)||{}).label || v);
    const vOpts = (isWish?['<option value="">— none —</option>']:[]).concat(
      volts.map(v=>`<option value="${esc(v)}" ${v===item.v?'selected':''}>${esc(vLabel(v))}</option>`)).join("");
    const pOpts = [["high","High"],["med","Medium"],["low","Low"]]
      .map(([k,l])=>`<option value="${k}" ${k===(item.priority||'med')?'selected':''}>${l}</option>`).join("");

    const batterySpecs = `
          <div class="fg-sub">Battery specs</div>
          <div><label class="flbl">Capacity (Ah)</label><input class="inp mono" type="number" step="0.1" data-k="capacity" value="${item.capacity!=null?item.capacity:''}" placeholder="e.g. 4.0"></div>
          <div><label class="flbl">Energy (Wh)</label><input class="inp mono" type="number" step="0.1" data-k="energy" value="${item.energy!=null?item.energy:''}" placeholder="e.g. 146"></div>
          <div><label class="flbl">Nominal voltage</label><input class="inp mono" data-k="nominal" value="${esc(item.nominal||'')}" placeholder="e.g. 21.6V (24V MAX)"></div>
          <div><label class="flbl">Chemistry</label><input class="inp" data-k="chemistry" value="${esc(item.chemistry||'')}" placeholder="Li-ion"></div>
          <div class="fg-full"><label class="flbl">Mfg date</label><input class="inp" type="date" data-k="mfg" value="${esc(item.mfg||'')}"></div>`;
    const toolSpecs = `
          <div class="fg-sub">Tool specs</div>
          <div><label class="flbl">Mfg date</label><input class="inp" type="date" data-k="mfg" value="${esc(item.mfg||'')}"></div>
          <div><label class="flbl">Battery compatibility</label><input class="inp mono" data-k="compat" value="${esc(item.compat||'')}" placeholder="e.g. BAG711 / 29462"></div>`;

    const warrantyField = `<div><label class="flbl">Warranty (years)</label><input class="inp mono" type="number" min="0" step="1" data-k="warranty_years" value="${item.warranty_years!=null?item.warranty_years:''}" placeholder="${DEFAULT_WARRANTY}"></div>`;

    const fields = isWish ? `
          <div class="fg-full"><label class="flbl">Item name</label><input class="inp" data-k="name" value="${esc(item.name)}" placeholder="e.g. 60V Pole Saw Attachment"></div>
          <div class="fg-full"><label class="flbl">Product link</label><input class="inp" data-k="url" value="${esc(item.url||'')}" placeholder="https://greenworkstools.com/…"></div>
          <div><label class="flbl">Retailer / store</label><input class="inp" data-k="store" value="${esc(item.store||'')}" placeholder="Greenworks, Amazon…"></div>
          <div><label class="flbl">Battery system</label><select class="inp" data-k="v">${vOpts}</select></div>
          <div><label class="flbl">Est. price ($)</label><input class="inp mono" type="number" data-k="price" value="${item.price||''}"></div>
          <div><label class="flbl">Priority</label><select class="inp" data-k="priority">${pOpts}</select></div>
          <div class="fg-full"><label class="flbl">Target date</label><input class="inp" type="date" data-k="target" value="${esc(item.target||'')}"></div>
          <div class="fg-full"><label class="flbl">Notes</label><textarea class="inp" data-k="notes" placeholder="Why you want it, deal to watch for, compatible kit…">${esc(item.notes)}</textarea></div>` : `
          <div class="fg-full"><label class="flbl">Name</label><input class="inp" data-k="name" value="${esc(item.name)}" placeholder="${isBatt?'e.g. 60V 4.0Ah Battery':'e.g. 60V Chainsaw'}"></div>
          <div><label class="flbl">Model</label><input class="inp" data-k="model" value="${esc(item.model)}"></div>
          <div><label class="flbl">Serial</label><input class="inp mono" data-k="serial" value="${esc(item.serial)}"></div>
          <div><label class="flbl">Battery system</label><select class="inp" data-k="v">${vOpts}</select></div>
          ${warrantyField}
          <div><label class="flbl">Purchase date</label><input class="inp" type="date" data-k="date" value="${esc(item.date)}"></div>
          <div><label class="flbl">Price paid ($)</label><input class="inp mono" type="number" data-k="price" value="${item.price||''}"></div>
          <div class="fg-full"><label class="flbl">Receipt / proof of purchase</label>${receiptHTML()}<input type="file" id="receipt-input" accept="image/*,application/pdf,.pdf" style="display:none"></div>
          <div class="fg-full"><label class="flbl">Owner's manual (PDF)</label>${manualHTML()}<input type="file" id="manual-input" accept="application/pdf,.pdf" style="display:none"></div>
          ${isBatt?batterySpecs:toolSpecs}
          <div class="fg-full"><label class="flbl">Notes</label><textarea class="inp" data-k="notes" placeholder="Storage location, accessories, condition…">${esc(item.notes)}</textarea></div>`;

    const subLine = isWish ? `${esc(item.store)||'Wishlist'}${item.url?' · '+esc(hostOf(item.url)):''}` : `${esc(item.model)||'—'} · ${esc(item.serial)||'no serial'}`;
    const newTitle = isWish?'New wishlist item':isBatt?'New battery':'New tool';
    const saveLabel = isWish?'item':(isBatt?'battery':'tool');

    const photoBlock = isWish ? "" : `<label id="photo-preview" data-photo-id="${item.id}">
          <span class="ph-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="m4 18 5-4 4 3 3-2 4 3"/></svg>Tap to add a photo</span>
        </label>
        <input type="file" id="photo-input" accept="image/*">`;

    $("#modal").innerHTML = `
      <div class="m-head">
        <div class="m-title">
          <h2>${esc(item.name)||newTitle}</h2>
          <div class="m-sub">${subLine}</div>
        </div>
        <button data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="m-body">
        ${photoBlock}
        <div class="form-grid">${fields}</div>
        ${kind==="tool"?maintHTML(item):''}
      </div>
      <div class="m-foot">
        ${existing?`<button class="btn danger" data-del="${item.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>Delete</button>`:''}
        ${(isWish && existing)?`<button class="btn acq" data-acquire="${item.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 3v11m0 0 4-4m-4 4-4-4"/></svg>Move to inventory</button>`:''}
        <span class="spacer"></span>
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" data-save="${item.id}">Save ${saveLabel}</button>

  async function loadModalPhoto(){
    const pv=$("#photo-preview"); if(!pv) return;
    const eff=modalState.pending.photo;
    let url = eff!==undefined ? eff : await getPhoto(modalState.item.id);
    if(url) pv.innerHTML=`<img src="${url}" alt="">`;
  }

  function maintHTML(x){
    const arr=x.maint||[];
    const logs=arr.map((m,idx)=>({m,idx})).sort((a,b)=>(b.m.d||"").localeCompare(a.m.d||""));
    return `<div class="maint" id="maint-host">
      <h3>Maintenance log <span class="ct">${arr.length}</span></h3>
      ${logs.length?logs.map(({m,idx})=>`<div class="mlog"><span class="md">${fmtDate(m.d)}</span><span class="mtxt">${esc(m.t)}</span><button data-delmaint="${idx}" aria-label="Delete entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join(""):`<p style="color:var(--muted);font-size:13px;margin:4px 0 0">No maintenance logged yet.</p>`}
      <div class="mlog-add">
        <input class="inp" type="date" id="maint-date" value="${todayISO()}">
        <input class="inp" id="maint-desc" placeholder="What did you do?">
        <button class="btn" type="button" id="maint-add">Add</button>
      </div>
    </div>`;
  }
  function refreshMaint(){ const h=$("#maint-host"); if(h) h.outerHTML=maintHTML(modalState.item); }
  function addMaint(){
    const d=$("#maint-date").value || todayISO();
    const t=($("#maint-desc").value||"").trim();
    if(!t) return;
    modalState.item.maint.push({d,t});
    refreshMaint();
  }

  /* ---------- receipt / manual slots ---------- */
  const PDF_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>';
  const RC_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18l2-1 2 1 2-1 2 1 2-1 2 1V3l-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>';
  const DL_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>';
  const X_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  function manualHTML(){
    const m = manualMeta(); const id = modalState.item.id;

      return `<div class="manual-slot has" data-manual-id="${id}">
        <div class="mf-open" data-manual-view="${id}" title="View manual">

        <button type="button" class="mf-act" data-manual-dl="${id}" title="Download" aria-label="Download manual">${DL_ICO}</button>
        <button type="button" class="mf-act" data-manual-del="${id}" title="Remove" aria-label="Remove manual">${X_ICO}</button>
      </div>`;

      <span class="mf-ico">${PDF_ICO}</span>
      <span class="mf-meta"><span class="mf-name">Add manual PDF</span><span class="mf-sub">Click to upload · saved to this device</span></span>
    </label>`;

  function receiptHTML(){
    const m = receiptMeta(); const id = modalState.item.id;
    if(m && m.name){
      return `<div class="manual-slot has" data-receipt-id="${id}">

  const PV_PDF_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>';

  /* ---------- collect + persist ---------- */
  function collectFields(){
    $$("#modal [data-k]").forEach(el=>{ modalState.item[el.dataset.k]=el.value; });
    ["price","capacity","energy","warranty_years"].forEach(k=>{
      if(k in modalState.item){ const v=modalState.item[k]; modalState.item[k] = (v===""||v==null) ? "" : Number(v); }
    });

  async function saveItem(){
    collectFields();
    const it=modalState.item, kind=modalState.kind;
    if(kind==="wishlist"){ if(!(it.name||"").trim()){ alert("Please give this item a name."); return; } it.icon="tag"; }
    else { if(!(it.name||"").trim()){ alert("Please give this "+(modalState.isBatt?"battery":"tool")+" a name."); return; }
           if(kind==="tool") it.icon=pickIcon(it.name); else it.icon="battery"; }

    // flush pending files to IndexedDB, update lightweight meta on the record
    if(modalState.pending.photo!==undefined){ if(modalState.pending.photo) await setPhoto(it.id,modalState.pending.photo); else await delPhoto(it.id); }
    if(modalState.pending.photoOrig!==undefined){ if(modalState.pending.photoOrig) await idbSet(photoOrigKey(it.id),modalState.pending.photoOrig); else await idbDelete(photoOrigKey(it.id)); }
    if(modalState.pending.crop!==undefined) it.crop=modalState.pending.crop;
    if(modalState.pending.receipt!==undefined){
      if(modalState.pending.receipt){ await idbSet(receiptKey(it.id),modalState.pending.receipt.dataURL);
        it.receipt={name:modalState.pending.receipt.name,size:modalState.pending.receipt.size,isImg:modalState.pending.receipt.isImg}; }
      else { await idbDelete(receiptKey(it.id)); it.receipt=null; }
    }
    if(modalState.pending.manual!==undefined){
      if(modalState.pending.manual){ await idbSet(manualKey(it.id),modalState.pending.manual.dataURL);
        it.manual={name:modalState.pending.manual.name,size:modalState.pending.manual.size}; }
      else { await idbDelete(manualKey(it.id)); it.manual=null; }
    }

    const coll = kind==="wishlist"?data.wishlist : modalState.isBatt?data.batteries : data.tools;
    const i=coll.findIndex(o=>o.id===it.id);
    if(i>=0) coll[i]=it; else coll.push(it);
    await propagatePhotoToSameModel(it, kind, coll);
    save(); closeModal(); render(true); refreshStats(true);
  }
  // when a photo and/or manual is set/changed, offer to reuse it for other items with the
  // same model number (same product = same photo + same manual). Receipts never propagate —
  // they're per-purchase, each physical item keeps its own. Removal never propagates either.
  async function propagatePhotoToSameModel(it, kind, coll){
    if(kind==="wishlist") return;
    const pend=modalState.pending;
    const sharePhoto  = pend.photo!==undefined  && !!pend.photo;   // just added/adjusted
    const shareManual = pend.manual!==undefined && !!pend.manual;  // just uploaded
    if(!sharePhoto && !shareManual) return;
    const key=(it.model||"").trim().toLowerCase(); if(!key) return;
    const sibs=coll.filter(o=>o.id!==it.id && (o.model||"").trim().toLowerCase()===key);
    if(!sibs.length) return;
    const what = sharePhoto && shareManual ? "photo and manual" : sharePhoto ? "photo and crop" : "manual";
    const noun = kind==="battery" ? (sibs.length>1?"batteries":"battery") : (sibs.length>1?"tools":"tool");
    if(!confirm(`${sibs.length} other ${noun} share${sibs.length>1?"":"s"} model “${it.model}”. Use this same ${what} for ${sibs.length>1?"them":"it"} too?`)) return;
    if(sharePhoto){
      const p=await getPhoto(it.id), po=await getPhotoOrig(it.id);
      for(const s of sibs){
        if(p) await setPhoto(s.id,p); else await delPhoto(s.id);
        if(po) await idbSet(photoOrigKey(s.id),po); else await idbDelete(photoOrigKey(s.id));
        s.crop = it.crop || null;
      }
    }
    if(shareManual){
      const m=await idbGet(manualKey(it.id));
      for(const s of sibs){
        if(m) await idbSet(manualKey(s.id),m); else await idbDelete(manualKey(s.id));
        s.manual = it.manual ? {...it.manual} : null;
      }
    }
  }
  async function deleteItem(id){
    if(!confirm("Delete this item permanently? This also removes its photo, receipt and manual.")) return;
    await delPhoto(id); await idbDelete(photoOrigKey(id)); await idbDelete(receiptKey(id)); await idbDelete(manualKey(id));
    data.tools     = data.tools.filter(x=>x.id!==id);
    data.batteries = data.batteries.filter(x=>x.id!==id);
    data.wishlist  = data.wishlist.filter(x=>x.id!==id);
    save(); closeModal(); render(true); refreshStats(true);
  }

  /* ---------- move a wishlist item into the inventory ---------- */
  function acquire(id){
    const i = data.wishlist.findIndex(w=>w.id===id);
    if(i<0){ closeModal(); return; }
    const w = data.wishlist[i];
    const isBatt = /batter|\b\d+(\.\d+)?\s*ah\b/i.test(w.name||"");
    const base = { id:uuid(), name:w.name, model:"", serial:"", v:w.v||defaultSystem(), date:todayISO(),
      price:(w.price===""||w.price==null)?"":Number(w.price), warranty_years:DEFAULT_WARRANTY,
      mfg:"", notes:w.notes||"", receipt:null, manual:null };
    const item = isBatt
      ? Object.assign(base,{capacity:"",energy:"",nominal:"",chemistry:"",icon:"battery"})
      : Object.assign(base,{compat:"",maint:[],icon:pickIcon(w.name)});
    (isBatt?data.batteries:data.tools).unshift(item);
    data.wishlist.splice(i,1);
    save(); closeModal();
    ui.tab = isBatt ? "batteries" : "tools";
    $$("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===ui.tab));
    render(true); refreshStats(true); celebrate();
    window.scrollTo({top:0,behavior:"smooth"});

    const colors=[P.bright, a, mixc(a,"#ffffff",0.5), P.deep, mixc(a,"#ffffff",0.7)];

  /* ---------- export / import / clear ---------- */
  /* Backup folder (File System Access API, Chromium only): the user picks a folder once,
     we keep its directory handle in IndexedDB under "backupDir" (survives reloads/restarts),
     and exports write straight into it. No folder set / unsupported / write fails → fall
     back to a normal browser download. The handle is a device setting, not data: it is
     excluded from export bundles and preserved across Import / Clear-everything. */
  const supportsFS = "showDirectoryPicker" in window;
  const BACKUP_DIR_KEY = "backupDir";
  const getBackupDir = () => idbGet(BACKUP_DIR_KEY);
  async function setBackupFolder(){
    try{
      const h = await window.showDirectoryPicker({ mode:"readwrite" });
      await idbSet(BACKUP_DIR_KEY, h);
      refreshBackupFolderUI(); flash(`Backups will save to “${h.name}” ✓`);
      scheduleAutoBackup();   // write a current backup right away (picker just granted readwrite)
    }catch(e){ if(e && e.name!=="AbortError") console.error(e); } // AbortError = user cancelled the picker
  }

  /* Auto-backup: after any data change (save()), quietly rewrite today's backup file in the
     chosen folder. Debounced so bursts of saves write once. Skipped when: no folder set,
     permission would need a prompt we can't silently show (next manual export re-grants it),
     or the data is completely empty — so Clear-everything can never wipe today's backup. */
  let autoBackupTimer=null;
  function scheduleAutoBackup(){ clearTimeout(autoBackupTimer); autoBackupTimer=setTimeout(autoBackup, 2500); }
  async function autoBackup(){
    try{
      if(!supportsFS) return;
      if(!data.tools.length && !data.batteries.length && !data.wishlist.length) return;
      const dir = await getBackupDir(); if(!dir) return;
      let perm = await dir.queryPermission({ mode:"readwrite" });
      if(perm!=="granted"){
        if(navigator.userActivation && navigator.userActivation.isActive)
          perm = await dir.requestPermission({ mode:"readwrite" });
        if(perm!=="granted") return;
      }
      const files = await idbAll(); delete files[BACKUP_DIR_KEY];
      const bundle = { schema:"greenworks-tracker", version:2, exportedAt:new Date().toISOString(),
                       tools:data.tools, batteries:data.batteries, wishlist:data.wishlist, settings:data.settings, files };
      const fh = await dir.getFileHandle("greenworks-tracker-"+todayISO()+".json", { create:true });
      const w = await fh.createWritable(); await w.write(JSON.stringify(bundle,null,2)); await w.close();
    }catch(e){ console.warn("auto-backup skipped:", e); }
  }
  async function clearBackupFolder(){
    await idbDelete(BACKUP_DIR_KEY);
    refreshBackupFolderUI(); flash("Backup folder cleared — exports will download");
  }
  async function refreshBackupFolderUI(){
    const host=$("#bk-folder"); if(!host) return;
    if(!supportsFS){
      host.innerHTML=`<span>Saving to a folder needs a Chromium browser (Chrome / Edge / Brave) — backups download instead.</span>`;
      return;
    }
    const FOLDER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
    const dir = await getBackupDir();
    if(dir){
      host.innerHTML=`<span>Backups save to <b>${esc(dir.name)}</b> — auto-saved after every change</span><span class="spread"></span>
        <button class="btn" id="bkdir-set" type="button">${FOLDER}Change…</button>
        <button class="btn" id="bkdir-clear" type="button">Clear</button>`;
    }else{
      host.innerHTML=`<span>Backups download to your Downloads folder. Set a folder to back up automatically after every change.</span><span class="spread"></span>
        <button class="btn" id="bkdir-set" type="button">${FOLDER}Set backup folder…</button>`;
    }
  }
  async function exportJSON(){
    const files = await idbAll();
    delete files[BACKUP_DIR_KEY];   // device setting, not data — keep it out of the bundle
    const bundle = { schema:"greenworks-tracker", version:2, exportedAt:new Date().toISOString(),
                     tools:data.tools, batteries:data.batteries, wishlist:data.wishlist, settings:data.settings, files };
    const json = JSON.stringify(bundle,null,2);
    const name = "greenworks-tracker-"+todayISO()+".json";
    const dir = supportsFS ? await getBackupDir() : null;
    if(dir){
      try{
        let perm = await dir.queryPermission({ mode:"readwrite" });
        if(perm!=="granted") perm = await dir.requestPermission({ mode:"readwrite" });
        if(perm==="granted"){
          const fh = await dir.getFileHandle(name, { create:true });
          const w = await fh.createWritable(); await w.write(json); await w.close();
          flash(`Backup saved to “${dir.name}” ✓`);
          return;
        }
      }catch(e){ console.error("backup folder write failed", e); }
      flash("Couldn't write to the backup folder — downloaded instead");
    }
    const blob=new Blob([json],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    if(!dir) flash("Backup exported ✓");
  }
  async function importJSON(file){
    let bundle; try{ bundle=JSON.parse(await file.text()); }catch(e){ alert("That file isn't valid JSON."); return; }
    if(!bundle || !Array.isArray(bundle.tools) || !Array.isArray(bundle.batteries)){
      alert("This file doesn't look like a Greenworks Tracker backup (missing tools/batteries)."); return;
    }
    if(!confirm("Import will REPLACE everything currently on this device — tools, batteries, wishlist and all files. Continue?")) return;
    const existing = await idbAll();
    for(const k of Object.keys(existing)){ if(k!==BACKUP_DIR_KEY) await idbDelete(k); }
    if(bundle.files && typeof bundle.files==="object"){ for(const [k,v] of Object.entries(bundle.files)){ if(k!==BACKUP_DIR_KEY) await idbSet(k,v); } }
    data = normalize({ tools:bundle.tools, batteries:bundle.batteries, wishlist:bundle.wishlist, settings:bundle.settings });
    save(); applyBrand(); render(true); refreshStats(true); flash("Import complete ✓");
  }
  async function clearAll(){
    if(!confirm("Delete ALL tools, batteries, wishlist items and files from this device? This cannot be undone.")) return;
    if(!confirm("Really delete everything? Export a backup first if unsure.")) return;
    const existing = await idbAll();
    for(const k of Object.keys(existing)){ if(k!==BACKUP_DIR_KEY) await idbDelete(k); }
    data = { tools:[], batteries:[], wishlist:[], settings:{} };
    save(); applyBrand(); render(true); refreshStats(true); flash("All data cleared");
  }

  /* ---------- merge purchase info from a filled CSV (matched by ID, then serial) ---------- */
  function parseCSV(text){
    const rows=[]; let row=[], cur="", q=false;
    text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    for(let i=0;i<text.length;i++){ const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=""; }
        else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=ch; } }
    if(cur!==""||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(r=>r.some(c=>c.trim()!==""));
  }
  function normalizeDate(s){ s=(s||"").trim(); if(!s) return "";
    if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){ const [y,m,d]=s.split("-"); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
    const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m){ let mo=+m[1],da=+m[2],yr=+m[3]; if(yr<100)yr+=2000; if(mo>12&&da<=12){ const t=mo; mo=da; da=t; } return `${yr}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`; }
    const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
  }
  function parsePrice(s){ s=(s||"").replace(/[^0-9.]/g,""); if(!s) return null; const n=parseFloat(s); return isNaN(n)?null:n; }
  async function importPurchaseCSV(file){
    const rows=parseCSV(await file.text());
    if(rows.length<2){ alert("That CSV looks empty."); return; }
    const hdr=rows[0].map(h=>h.trim().toLowerCase());
    const col=(...names)=>hdr.findIndex(h=>names.some(n=>h.includes(n)));
    const ci={ id:col("id"), serial:col("serial","s/n"), date:col("date"), price:col("price","amount","paid","cost") };
    if(ci.date<0 && ci.price<0){ alert("Couldn't find an Order Date or Price column in that CSV. Expected headers like “Order Date” and “Price Paid”."); return; }
    const all=[...data.tools,...data.batteries];
    let updated=0, unmatched=0, badDates=0;
    for(let r=1;r<rows.length;r++){
      const row=rows[r];
      const id=ci.id>=0?(row[ci.id]||"").trim():"";
      const serial=ci.serial>=0?(row[ci.serial]||"").trim().toLowerCase():"";
      let it = id && all.find(x=>x.id===id);
      if(!it && serial) it=all.find(x=>(x.serial||"").trim().toLowerCase()===serial);
      if(!it){ if(id||serial) unmatched++; continue; }
      let changed=false;
      if(ci.date>=0){ const raw=row[ci.date]; const nd=normalizeDate(raw); if(nd){ if(nd!==it.date){ it.date=nd; changed=true; } } else if((raw||"").trim()) badDates++; }
      if(ci.price>=0){ const np=parsePrice(row[ci.price]); if(np!=null && np!==it.price){ it.price=np; changed=true; } }
      if(changed) updated++;
    }
    save(); render(true); refreshStats(true);
    alert(`Purchase info imported.\nUpdated ${updated} item(s).`
      + (unmatched?`\n${unmatched} row(s) didn't match any item — skipped.`:"")
      + (badDates?`\n${badDates} date(s) couldn't be read (use YYYY-MM-DD).`:""));
  }

  /* ---------- toast ---------- */
  let toastEl;
  function flash(msg){
    if(!toastEl){ toastEl=document.createElement("div"); toastEl.style.cssText=
      "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none";
      document.body.appendChild(toastEl); }
    toastEl.textContent=msg; toastEl.style.opacity="1"; toastEl.style.transform="translateX(-50%) translateY(-4px)";
    clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>{ toastEl.style.opacity="0"; toastEl.style.transform="translateX(-50%)"; },1600);
  }

  /* ---------- theme ---------- */
  const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); const b=$("#theme-btn"); if(b) b.innerHTML = t==="light" ? SUN : MOON; }
  let theme = document.documentElement.getAttribute("data-theme") || "dark";

  /* ---------- custom sort dropdown (mirrors the hidden native #sort) ---------- */
  function syncSortUI(){
    const sel=$("#sort"), btn=$("#csel-btn"), pop=$("#csel-pop"), label=$("#csel-label");
    if(!sel||!btn) return;
    const cur=sel.options[sel.selectedIndex];
    if(label) label.textContent = cur ? cur.text : "";
    if(pop) pop.innerHTML=[...sel.options].filter(o=>!o.hidden).map(o=>
      `<div class="csel-opt" role="option" data-val="${o.value}" aria-selected="${o.value===sel.value?'true':'false'}">${o.text}</div>`).join("");
  }
  function toggleSortPop(open){
    const pop=$("#csel-pop"), btn=$("#csel-btn"); if(!pop) return;
    const will = open!==undefined ? open : !pop.classList.contains("open");
    pop.classList.toggle("open", will); if(btn) btn.setAttribute("aria-expanded", will?'true':'false');
  }
  function moveActive(dir){
    const opts=[...$$("#csel-pop .csel-opt")]; if(!opts.length) return;
    let i=opts.findIndex(o=>o.classList.contains("active"));
    if(i<0) i=opts.findIndex(o=>o.getAttribute("aria-selected")==="true");
    i=(i+dir+opts.length)%opts.length;
    opts.forEach(o=>o.classList.remove("active")); opts[i].classList.add("active"); opts[i].scrollIntoView({block:"nearest"});
  }
  function chooseSort(val){ const sel=$("#sort"); sel.value=val; sel.dispatchEvent(new Event("change")); toggleSortPop(false); }

  /* ============================================================
     EVENTS
     ============================================================ */
  $("#tabs").addEventListener("click", e=>{
    const b=e.target.closest("[data-tab]"); if(!b) return;
    $$("#tabs button").forEach(x=>x.classList.toggle("active", x===b));
    ui.tab=b.dataset.tab; ui.q=""; $("#search").value=""; render(true);
    window.scrollTo({top:0,behavior:"smooth"});
  });
  $("#search").addEventListener("input", e=>{ ui.q=e.target.value; render(false); });
  $("#sort").addEventListener("change", e=>{ ui.sort=e.target.value; render(false); });

  document.addEventListener("click", e=>{
    if(e.target.closest('a[data-extlink]')) return;           // let wishlist links open normally
    // custom sort dropdown
    if(!e.target.closest(".sel-wrap")) toggleSortPop(false);  // click anywhere outside closes it
    if(e.target.closest("#csel-btn")){ toggleSortPop(); return; }
    const csopt=e.target.closest(".csel-opt");
    if(csopt){ chooseSort(csopt.dataset.val); return; }
    if(e.target.closest("#theme-btn")){ theme=theme==="light"?"dark":"light"; try{localStorage.setItem(THEME_KEY,theme);}catch(_){} applyTheme(theme); return; }
    const acq=e.target.closest("[data-acquire]");
    if(acq){ acquire(acq.dataset.acquire); return; }
    const add=e.target.closest('[data-action="add"]');
    if(add){ openModal("new"); return; }
    // settings
    if(e.target.closest("#export-btn")){ exportJSON(); return; }
    if(e.target.closest("#import-btn")){ $("#import-file").click(); return; }
    if(e.target.closest("#clear-btn")){ clearAll(); return; }
    if(e.target.closest("#purch-btn")){ $("#purch-file").click(); return; }
    if(e.target.closest("#bkdir-set")){ setBackupFolder(); return; }
    if(e.target.closest("#bkdir-clear")){ clearBackupFolder(); return; }
    if(e.target.closest("#brand-apply")){
      const name=($("#brand-name").value||"").trim()||"My Tools";
      data.settings.brand={ preset:"custom", name, accent:$("#brand-color").value, systems:$("#brand-systems").value };
      save(); applyBrand(); render(true); flash(`Brand set to ${name} ✓`); return;
    }
    // modal file actions
    if(e.target.closest("#photo-preview")){ if($("#photo-preview img")) adjustExistingPhoto(); else { const inp=$("#photo-input"); if(inp) inp.click(); } return; }
    const mvw=e.target.closest("[data-manual-view]"); if(mvw){ openManualViewer(mvw.dataset.manualView); return; }
    const mdl=e.target.closest("[data-manual-dl]"); if(mdl){ downloadFileFor("manual",mdl.dataset.manualDl); return; }
    const mde=e.target.closest("[data-manual-del]"); if(mde){ modalState.pending.manual=null; refreshManual(); return; }
    const rvw=e.target.closest("[data-receipt-view]"); if(rvw){ openReceiptViewer(rvw.dataset.receiptView); return; }
    const rdl=e.target.closest("[data-receipt-dl]"); if(rdl){ downloadFileFor("receipt",rdl.dataset.receiptDl); return; }
    const rde=e.target.closest("[data-receipt-del]"); if(rde){ modalState.pending.receipt=null; refreshReceipt(); return; }
    // maintenance
    if(e.target.closest("#maint-add")){ addMaint(); return; }
    const dm=e.target.closest("[data-delmaint]"); if(dm){ modalState.item.maint.splice(+dm.dataset.delmaint,1); refreshMaint(); return; }
    // modal open / save / delete
    const open=e.target.closest("[data-open]");
    if(open && !e.target.closest("#modal")){ openModal(open.dataset.open); return; }
    const save2=e.target.closest("[data-save]"); if(save2){ saveItem(); return; }
    const del=e.target.closest("[data-del]"); if(del){ deleteItem(del.dataset.del); return; }
    if(e.target.closest("[data-close]")){ closeModal(); return; }
  });

  document.addEventListener("change", async e=>{
    if(e.target.id==="brand-select"){
      const v=e.target.value;
      if(v==="custom"){ const p=$("#brand-custom"); if(p) p.style.display="block"; return; }
      data.settings.brand={ preset:v }; save(); applyBrand(); render(true);
      flash(`Brand set to ${BRANDS[v].name} ✓`); return;
    }
    if(e.target.id==="import-file"){ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; return; }
    if(e.target.id==="purch-file"){ if(e.target.files[0]) importPurchaseCSV(e.target.files[0]); e.target.value=""; return; }
    if(!modalState) return;
    if(e.target.id==="photo-input" && e.target.files[0]){
      const orig=await resizeImage(e.target.files[0],1600,0.82);   // keep a capped original so it can be re-adjusted later
      e.target.value="";
      openCropper(orig, null, applyPhotoResult);
    }
    if(e.target.id==="receipt-input" && e.target.files[0]){
      const f=e.target.files[0]; const isImg=f.type.indexOf("image/")===0;
      const dataURL = isImg ? await resizeImage(f, 1400, 0.72) : await fileToDataURL(f);
      modalState.pending.receipt={ name:f.name, size:fmtSize(f.size), isImg, dataURL };
      refreshReceipt(); e.target.value="";
    }
    if(e.target.id==="manual-input" && e.target.files[0]){
      const f=e.target.files[0];
      const dataURL = await fileToDataURL(f);
      modalState.pending.manual={ name:f.name, size:fmtSize(f.size), dataURL };
      refreshManual(); e.target.value="";
    }
  });

  $("#modal-bg").addEventListener("click", e=>{ if(e.target.id==="modal-bg") closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key!=="Escape") return;
    if($("#pdfview") && $("#pdfview").classList.contains("open")) closePdfViewer();
    else if($("#cropper") && $("#cropper").classList.contains("open")) closeCropper();
    else if($("#csel-pop") && $("#csel-pop").classList.contains("open")){ toggleSortPop(false); const b=$("#csel-btn"); if(b) b.focus(); }
    else if($("#modal-bg").classList.contains("open")) closeModal(); });
  // sort dropdown keyboard nav
  $("#csel-btn").addEventListener("keydown", e=>{
    if((e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter"||e.key===" ") && !$("#csel-pop").classList.contains("open")){ e.preventDefault(); toggleSortPop(true); }
  });
  document.addEventListener("keydown", e=>{
    const pop=$("#csel-pop"); if(!pop || !pop.classList.contains("open")) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); moveActive(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveActive(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); const a=$("#csel-pop .csel-opt.active")||$("#csel-pop .csel-opt[aria-selected='true']"); if(a){ chooseSort(a.dataset.val); const b=$("#csel-btn"); if(b) b.focus(); } }
  });

  /* ---------- init ---------- */
  applyTheme(theme);
  applyBrand();
  render(true);
  refreshStats(true);
})();
</script>
</body>
</html>
